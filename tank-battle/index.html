      '<span class="sc-name">'+t.name+'</span></div>'+
      '<div class="tk-stats"><span>血量 <b>'+t.hp+'</b></span><span>移速 <b>'+t.speed+'</b></span><span>射速 <b>'+t.fireRate.toFixed(2)+'s</b></span></div>'+
      '<div class="sc-desc">技能【'+t.skillName+'】冷却 '+t.skillCd+'s · '+t.skillDesc+'</div>'+
      '<div class="sc-foot">'+foot+'</div>';
    list.appendChild(card);
  }
  list.querySelectorAll('.tk-icon').forEach(cv=>paintTankIcon(cv, cv.dataset.tk, TANKS_BY_ID[cv.dataset.tk].color));
  list.querySelectorAll('[data-tbuy]').forEach(btn=>btn.onclick=()=>buyTank(btn.dataset.tbuy));
  list.querySelectorAll('[data-teq]').forEach(btn=>btn.onclick=()=>equipTank(btn.dataset.teq));
}
function buyTank(id){
  const db=DB.load(), t=TANKS_BY_ID[id];
  if (db.gold<t.price){ showWarn('金币不足！','#ff4444'); return; }
  if (db.tanks.includes(id)) return;
  db.gold-=t.price; db.tanks.push(id); db.tank=id;
  DB.save(db); Audio.pickup(); refreshTankShop(); updateHudGold();
}
function equipTank(id){
  const db=DB.load();
  if (!db.tanks.includes(id)) return;
  db.tank=id; DB.save(db); Audio.pickup(); refreshTankShop(); updateHudGold();
}
function openTankShop(){
  refreshTankShop();
  document.getElementById('overlay').style.display='none';
  document.getElementById('tankOverlay').classList.add('show');
}
function closeTankShop(){
  document.getElementById('tankOverlay').classList.remove('show');
  document.getElementById('overlay').style.display='flex';
}
document.getElementById('tankBtn').addEventListener('click', openTankShop);
document.getElementById('tankBack').addEventListener('click', closeTankShop);
document.getElementById('tankClose').addEventListener('click', closeTankShop);

/* ---------- 16. 启动 ---------- */
// 模式选择面板：填充四种模式的卡片
function openModeSelect(){
  Audio.init();
  const list=document.getElementById('modeList');
  list.innerHTML='';
  for (const key of ['infinite','campaign','bossrush','coop']){
    const m=MODES[key];
    const card=document.createElement('div');
    card.className='mode-card';
    card.innerHTML='<div class="mc-icon" style="color:'+m.color+'">'+m.icon+'</div>'+
      '<div><div class="mc-name">'+m.name+'</div><div class="mc-desc">'+m.desc+'</div></div>'+
      '<div class="mc-tag">'+m.tag+'</div>';
    card.addEventListener('click', ()=>{
      game.mode=key;
      if (key==='campaign'){ openLevelSelect(); }   // 闯关模式先进子关卡选择
      else { beginGame(); }
    });
    list.appendChild(card);
  }
  document.getElementById('overlay').style.display='none';
  document.getElementById('modeOverlay').classList.add('show');
}
function closeModeSelect(){
  document.getElementById('modeOverlay').classList.remove('show');
  document.getElementById('overlay').style.display='flex';
}
/* ---- 闯关子关卡选择 ---- */
function openLevelSelect(){
  document.getElementById('modeOverlay').classList.remove('show');
  const grid=document.getElementById('levelGrid');
  grid.innerHTML='';
  const db=DB.load();
  for (let i=1;i<=LEVELS.length;i++){
    const lv=LEVELS[i-1];
    const unlocked=i<=db.levelUnlocked;
    const cell=document.createElement('div');
    cell.className='level-cell'+(unlocked?'':' locked');
    cell.innerHTML='<div class="lc-num">'+i+'</div>'+
      '<div class="lc-name">'+lv.name+'</div>'+
      (lv.boss>=0?'<div class="lc-boss">☠ 首领</div>':'')+
      (unlocked?'':'<div class="lc-lock">🔒</div>');
    if (unlocked){
      cell.title=lv.desc;
      cell.addEventListener('click', ()=>{ game.level=i; beginGame(); });
    }
    grid.appendChild(cell);
  }
  document.getElementById('levelOverlay').classList.add('show');
}
function closeLevelSelect(){
  document.getElementById('levelOverlay').classList.remove('show');
  document.getElementById('modeOverlay').classList.add('show');
}
function beginGame(){
  document.getElementById('modeOverlay').classList.remove('show');
  document.getElementById('levelOverlay').classList.remove('show');
  resetGame();
  game.status='PLAYING';
}
document.getElementById('startBtn').addEventListener('click', openModeSelect);
document.getElementById('modeBack').addEventListener('click', closeModeSelect);
document.getElementById('levelBack').addEventListener('click', closeLevelSelect);
// 音量键：点击在 100% / 60% / 30% / 静音 间循环切换
(function(){
  const LEVELS=[
    {v:1,   icon:'🔊'},
    {v:0.6, icon:'🔉'},
    {v:0.3, icon:'🔈'},
    {v:0,   icon:'🔇'},
  ];
  const btn=document.getElementById('btnVol');
  // 阻止鼠标/触摸聚焦按钮，避免聚焦后按空格被浏览器当成重复点击连续切换音量
  btn.addEventListener('mousedown', e=>e.preventDefault());
  btn.addEventListener('touchstart', e=>e.preventDefault(), {passive:false});
  function refresh(){
    let idx=0, best=-1;
    for (let i=0;i<LEVELS.length;i++){ if (LEVELS[i].v<=Audio.volume+1e-6 && LEVELS[i].v>best){ best=LEVELS[i].v; idx=i; } }
    btn.textContent = LEVELS[idx].icon;
  }
  btn.addEventListener('click', ()=>{
    Audio.init();
    let cur=0;
    for (let i=0;i<LEVELS.length;i++){ if (Math.abs(LEVELS[i].v-Audio.volume)<1e-6){ cur=i; break; } }
    const next=LEVELS[(cur+1)%LEVELS.length];
    Audio.setVolume(next.v); refresh();
    Audio.pickup();   // 反馈提示音
  });
  refresh();
})();
document.getElementById('btnPause').addEventListener('click', ()=>{
  if (game.status==='PLAYING'){ game.status='PAUSED'; document.getElementById('btnPause').textContent='继续'; }
  else if (game.status==='PAUSED'){ game.status='PLAYING'; document.getElementById('btnPause').textContent='暂停'; }
});
window.addEventListener('keydown', e=>{
  if (e.code==='Enter' && game.status==='MENU') openModeSelect();
  if (e.code==='KeyP'){
    if (game.status==='PLAYING'){ game.status='PAUSED'; document.getElementById('btnPause').textContent='继续'; }
    else if (game.status==='PAUSED'){ game.status='PLAYING'; document.getElementById('btnPause').textContent='暂停'; }
  }
});
// 触屏设备显示虚拟控制
if (('ontouchstart' in window) || navigator.maxTouchPoints>0){ document.body.classList.add('touch'); }

Input.init();
updateHudGold();
// 初始渲染空闲状态
ctx.fillStyle='#04070d'; ctx.fillRect(0,0,W,H);
requestAnimationFrame(loop);
</script>
