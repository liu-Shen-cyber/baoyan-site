      wechat: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg>',
      phone: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
      copy: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
    };

    /* ============ 复制与提示 ============ */
    function copyToClipboard(text) {
      let done = function(){ showToast(); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function(){
          fallbackCopy(text); done();
        });
      } else { fallbackCopy(text); done(); }
    }
    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
    }
    function showToast() {
      var t = document.getElementById('toast');
      t.classList.add('show');
      clearTimeout(t._t);
      t._t = setTimeout(function(){ t.classList.remove('show'); }, 2000);
    }

    /* ============ 渲染 ============ */
    function render() {
      var root = document.getElementById('root');
      root.innerHTML = [
        '<div class="wrap">',

        /* ----- 头部 ----- */
        '<div class="card hero fade d1">',
          '<img class="avatar" src="' + profile.avatar + '" alt="' + profile.name + '">',
          '<h1 class="hero-name">' + profile.name + ' <span class="wave">👋</span></h1>',
          '<p class="hero-tagline">' + profile.tagline + '</p>',
          '<div class="tags">' + profile.keywords.map(function(k){ return '<span class="tag">' + k + '</span>'; }).join('') + '</div>',
          '<div class="socials">',
            '<a class="social-btn mail" href="mailto:' + profile.contact.email.value + '" title="邮件">' + icons.mail + '</a>',
            '<button class="social-btn wechat" onclick="copyToClipboard(\'' + profile.contact.wechat.value + '\')" title="复制微信">' + icons.wechat + '</button>',
            (profile.contact.phone.value ? '<button class="social-btn phone" onclick="copyToClipboard(\'' + profile.contact.phone.value + '\')" title="复制电话">' + icons.phone + '</button>' : ''),
          '</div>',
        '</div>',

        /* ----- 关于我 ----- */
        '<div class="card fade d2">',
          '<h2 class="section-title"><span class="emoji">😊</span>关于我</h2>',
          '<p class="about-intro">' + profile.about.intro + '</p>',
          '<div class="info-grid">' + profile.about.infoCards.map(function(c){
            return '<div class="info-card"><div class="ic">' + c.icon + '</div><div class="il">' + c.label + '</div><div class="iv">' + c.value + '</div><div class="is">' + c.sub + '</div></div>';
          }).join('') + '</div>',
        '</div>',

        /* ----- 技能栈 ----- */
        '<div class="card fade d3">',
          '<h2 class="section-title"><span class="emoji">⚡</span>技能栈</h2>',
          Object.keys(profile.skills).map(function(cat){
            var skills = profile.skills[cat];
            return '<div class="skill-block"><div class="skill-cat">' + cat + '</div><div class="skill-tags">' +
              skills.map(function(s){
                var link = s.link ? '<span class="skill-tag lvl' + s.level + ' linkable" onclick="location.hash=\'' + s.link + '\'">' + s.name + ' →</span>'
                                  : '<span class="skill-tag lvl' + s.level + '">' + s.name + '</span>';
                return link;
              }).join('') +
            '</div></div>';
          }).join('') +
          '<div class="legend"><span><i class="dot d1"></i>了解</span><span><i class="dot d2"></i>熟悉</span><span><i class="dot d3"></i>掌握</span><span><i class="dot d4"></i>熟练</span></div>',
        '</div>',

        /* ----- 竞赛与荣誉 ----- */
        '<div class="card fade d4">',
          '<h2 class="section-title"><span class="emoji">🏆</span>竞赛与荣誉</h2>',
          '<p class="section-sub">🎒 刚上大学还没大学荣誉，以下是有代表性的高中荣誉 🐶</p>',
          profile.awards.map(function(g){
            var c = aColor[g.color];
            return '<div class="award-group"><div class="award-head">' +
              '<i class="adot" style="background:' + c.dot + '"></i>' +
              '<span class="aname" style="color:' + c.txt + '">' + g.level + '</span>' +
              '<span class="aline"></span></div>' +
              '<div class="award-grid">' + g.items.map(function(a){
                return '<div class="award-item" style="background:' + c.bg + '">' +
                  '<div class="award-medal">🏅</div>' +
                  '<div><div><span class="award-name">' + a.name + '</span>' + (a.year ? '<span class="award-year">' + a.year + '</span>' : '') + '</div>' +
                  (a.desc ? '<div class="award-desc">' + a.desc + '</div>' : '') +
                '</div></div>';
              }).join('') + '</div></div>';
          }).join(''),
        '</div>',

        /* ----- 兴趣爱好 ----- */
        '<div class="card fade d5">',
          '<h2 class="section-title"><span class="emoji">🎈</span>兴趣爱好</h2>',
          '<p class="section-sub">工作学习之外的生活小乐趣 🌈</p>',
          '<div class="hobby-grid">' + profile.hobbies.map(function(h){
            return (h.link
              ? '<a class="hobby linked" href="#' + h.link + '"><div class="hi">' + h.icon + '</div><div class="hn">' + h.name + '</div><div class="hl">点击看' + (h.linkText || '详情') + ' →</div><div class="hd">' + h.desc + '</div></a>'
              : '<div class="hobby"><div class="hi">' + h.icon + '</div><div class="hn">' + h.name + '</div><div class="hd">' + h.desc + '</div></div>');
          }).join('') + '</div>',
        '</div>',

        /* ----- 摄影 ----- */
        '<div class="card fade d6 anchor" id="photography">',
          '<h2 class="section-title"><span class="emoji">📷</span>摄影作品</h2>',
          '<p class="section-sub">一些随手拍的瞬间 📸</p>',
          (profile.photos.length ? '<div class="grid-auto">' + profile.photos.map(function(p){
            return '<div class="photo"><img src="' + p + '" alt="照片" loading="lazy"></div>';
          }).join('') + '</div>' : emptyState('🖼️', '照片正在加载中...', '待会传了图就能看到啦~')),
        '</div>',

        /* ----- 最近在读 ----- */
        '<div class="card fade anchor" id="reading">',
          '<h2 class="section-title"><span class="emoji">📚</span>最近在读</h2>',
          '<p class="section-sub">虚构类作品爱好者 📖</p>',
          (profile.books.length ? '<div class="grid-auto">' + profile.books.map(function(b){
            return '<div class="list-item"><div class="list-icon" style="background:' + (b.cover || 'var(--accent-soft)') + '">' + (b.coverEmoji || '📖') + '</div><div class="list-main"><div class="list-title">' + b.title + '</div><div class="list-meta">' + (b.author || '') + '</div></div></div>';
          }).join('') + '</div>' : emptyState('📚', '待添加', '好看的书会记录在这里~')),
        '</div>',

        /* ----- 歌单 ----- */
        '<div class="card fade anchor" id="music">',
          '<h2 class="section-title"><span class="emoji">🎵</span>我的歌单</h2>',
          '<p class="section-sub">什么都听一点，杂食动物 🎧</p>',
          (profile.music.length ? '<div class="grid-auto">' + profile.music.map(function(s){
            return '<div class="list-item"><div class="list-icon" style="background:var(--purple-soft)">' + (s.coverEmoji || '🎵') + '</div><div class="list-main"><div class="list-title">' + s.title + '</div><div class="list-meta">' + (s.artist || '') + '</div></div></div>';
          }).join('') + '</div>' : emptyState('🎵', '待添加', '喜欢的歌会记录在这里~')),
        '</div>',

        /* ----- 游戏库 ----- */
        '<div class="card fade anchor" id="games">',
          '<h2 class="section-title"><span class="emoji">🎮</span>游戏库</h2>',
          '<p class="section-sub">不怕被我菜死就可以一起玩 🕹️</p>',
          (profile.games.length ? '<div class="grid-auto">' + profile.games.map(function(g){
            return '<div class="list-item"><div class="list-icon" style="background:' + (gColor[g.cover] || 'var(--bg)') + '">' + g.emoji + '</div><div class="list-main"><div class="list-title">' + g.name + '</div>' +
              (g.gameId ? '<div class="list-meta" style="color:var(--accent);font-weight:500">ID: ' + g.gameId + '</div>' : '') +
              (g.desc ? '<div class="list-meta">' + g.desc + '</div>' : '') + '</div></div>';
          }).join('') + '</div>' : emptyState('🎮', '游戏列表加载中...', '快来喊我打游戏呀~')),
        '</div>',

        /* ----- 足迹 ----- */
        '<div class="card fade anchor" id="travel">',
          '<h2 class="section-title"><span class="emoji">🗺️</span>我的足迹</h2>',
          '<p class="section-sub">读万卷书，行万里路 ✈️</p>',
          (profile.travels.length ? '<div class="grid-auto tight">' + profile.travels.map(function(t){
            return '<div class="hobby"><div class="hi" style="font-size:32px">' + t.emoji + '</div><div class="hn">' + t.place + '</div><div class="hd">' + (t.province ? t.province + ' · ' : '') + t.date + '</div></div>';
          }).join('') + '</div>' : emptyState('📍', '待添加', '去过的地方会慢慢记录在这里~')),
        '</div>',

        /* ----- 片单 ----- */
        '<div class="card fade anchor" id="movies">',
          '<h2 class="section-title"><span class="emoji">🎬</span>我的片单</h2>',
          '<p class="section-sub">什么类型都看，不挑食 🍿</p>',
          (profile.movies.length ? '<div class="grid-auto">' + profile.movies.map(function(m){
            return '<div class="photo" style="aspect-ratio:2/3"><img src="' + m.poster + '" alt="' + m.title + '" loading="lazy"></div>';
          }).join('') + '</div>' : emptyState('🎬', '待添加', '好看的电影会记录在这里~')),
        '</div>',

        /* ----- 联系我 ----- */
        '<div class="card fade">',
          '<h2 class="section-title"><span class="emoji">💌</span>联系我</h2>',
          contactItem('var(--accent-soft)', 'var(--accent)', icons.mail, '邮箱 · ' + profile.contact.email.hint, profile.contact.email.value, '', profile.contact.email.value) +
          contactItem('var(--green-soft)', 'var(--green)', icons.wechat, '微信 · ' + profile.contact.wechat.hint, profile.contact.wechat.value, (profile.contact.wechat.nickname ? '昵称：' + profile.contact.wechat.nickname : ''), profile.contact.wechat.value) +
          (profile.contact.phone.value ? contactItem('var(--orange-soft)', 'var(--orange)', icons.phone, '电话' + (profile.contact.phone.hint ? ' · ' + profile.contact.phone.hint : ''), profile.contact.phone.value, '', profile.contact.phone.value) : ''),
          '<p class="close-line">很高兴认识你，欢迎随时联系~ 😊</p>',
        '</div>',

        /* ----- PPT ----- */
        '<div class="card fade anchor" id="ppt">',
          '<h2 class="section-title"><span class="emoji">📊</span>PPT封面制作成果</h2>',
          '<p class="section-sub">可接PPT美化 ✨</p>',
          '<div class="grid-auto">' + profile.pptWorks.map(function(w){
            return '<div class="card-hover list-item" style="display:block;padding:0;overflow:hidden">' +
              '<div style="aspect-ratio:16/9;overflow:hidden"><img src="' + w.image + '" alt="' + w.title + '" style="width:100%;height:100%;object-fit:cover;transition:transform .5s" class="ppt-img"></div>' +
              '<div style="padding:14px"><div class="list-title">' + w.title + '</div><div class="list-meta">' + (w.desc || '') + '</div></div></div>';
          }).join('') + '</div>',
        '</div>',

        /* ----- 页脚 ----- */
        '<div class="close-line"><div>Designed with ❤️</div><small>© 2026 ' + profile.name + '</small></div>',

        '</div>'
      ].join('');

      /* PPT 图片 hover 放大 */
      var imgs = root.querySelectorAll('.ppt-img');
      for (var i = 0; i < imgs.length; i++) {
        (function(img){
          img.parentNode.parentNode.addEventListener('mouseenter', function(){ img.style.transform = 'scale(1.05)'; });
          img.parentNode.parentNode.addEventListener('mouseleave', function(){ img.style.transform = 'scale(1)'; });
        })(imgs[i]);
      }
    }

    /* ============ 空状态 ============ */
    function emptyState(icon, title, sub) {
      return '<div class="empty"><div class="eic">' + icon + '</div><div class="et">' + title + '</div><div class="es">' + sub + '</div></div>';
    }

    /* ============ 联系条目 ============ */
    function contactItem(bg, fg, icon, label, value, note, copyVal) {
      return '<div class="contact-item">' +
        '<div class="contact-icon" style="background:' + bg + ';color:' + fg + '">' + icon + '</div>' +
        '<div class="ct-main"><div class="contact-label">' + label + '</div><div class="contact-value">' + value + '</div>' +
        (note ? '<div class="contact-note">' + note + '</div>' : '') + '</div>' +
        '<button class="copy-btn" onclick="copyToClipboard(\'' + copyVal + '\')">' + icons.copy + '</button></div>';
    }

    document.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
